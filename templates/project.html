<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Driver Drowsiness Detection - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:70px;
}

h2{
    text-align:center;
    color:#2c5364;
    margin:15px 0;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#2c5364;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b3b4b;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#2c5364;
    text-decoration:none;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:gray;
    font-size:13px;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">🚗</div>

<h2>AI Driver Drowsiness Detection</h2>

<p>Login to Continue</p>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Register</a>
</div>

<div class="footer">
Powered by AI • OpenCV • MediaPipe
</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

let email=document.getElementById("email").value;

let password=document.getElementById("password").value;

if(email=="admin@gmail.com" && password=="123456")
{
alert("Login Successful");

window.location="dashboard.html";
}
else
{
alert("Invalid Email or Password");
}

});

</script>

</body>
</html>
