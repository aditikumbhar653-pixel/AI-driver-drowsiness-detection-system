<!DOCTYPE html>
<html>
<head>
    <title>Create New Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Create New Password</h2>

        <form action="/create_password" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter Registered Email"
                required
            >

            <input
                type="password"
                name="new_password"
                placeholder="Enter New Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm New Password"
                required
            >

            <button type="submit">
                Create New Password
            </button>

        </form>

        <a class="back" href="/">
            Back to Login
        </a>

    </div>

</body>
</html>
