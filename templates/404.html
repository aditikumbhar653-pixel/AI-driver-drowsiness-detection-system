<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | AI Driver Drowsiness</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            color: #1e293b;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 50px 35px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12);
        }

        .icon {
            font-size: 65px;
        }

        .error-code {
            font-size: 80px;
            font-weight: 800;
            margin: 10px 0;
            color: #2563eb;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚗</div>

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for
            does not exist or may have been moved.
        </p>

        <a href="{{ url_for('dashboard') }}" class="btn">
            🏠 Back to Dashboard
        </a>

    </div>

</body>

</html>
